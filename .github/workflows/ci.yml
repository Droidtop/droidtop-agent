name: CI

# Every push builds and tests the agent and its window-and-tray app on Windows,
# Linux (x86_64 and aarch64) and macOS (arm64, and x86_64 built beside it), and builds
# droidtop's library for both Android ABIs. On Linux the programs are also
# packed four ways (packaging/linux): a tarball, one runnable file, a .deb and
# an .rpm; on Windows they are also made into a per-user installer
# (packaging/windows). A green push to main publishes a release: the computer programs,
# the Linux packages with install.sh, uninstall.sh and SHA256SUMS, and the
# Android library droidtop fetches by its pin (docs/DESIGN.md section 12).
# Releases are permanent history.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The bundled game databases moved with the scanner and the engine detector: lib-games and lib-engines
  # (Droidtop/tracker#867) check that their copies are droidtop-platforms' files at their pinned commit.

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: linux-x86_64
          - os: ubuntu-24.04-arm
            system: linux-aarch64
          - os: windows-latest
            system: windows-x86_64
            ext: .exe
          - os: macos-latest
            system: macos-arm64
            # The Intel build is made on the same runner.
            also: x86_64-apple-darwin
            also_system: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: success() || failure()
        run: cargo clippy --workspace --all-targets --keep-going -- -D warnings

      - name: Test
        if: success() || failure()
        run: cargo test --workspace --no-fail-fast

      - name: Build the agent and the app
        shell: bash
        env:
          SYSTEM: ${{ matrix.system }}
          EXT: ${{ matrix.ext }}
          ALSO: ${{ matrix.also }}
          ALSO_SYSTEM: ${{ matrix.also_system }}
          RUN: ${{ github.run_number }}
        run: |
          set -eu
          mkdir -p dist
          # dist/<program>-<system>[.exe]; on macOS the app is also a .app
          # bundle (a tray app: no Dock icon), zipped.
          place() {
            local dir="$1" system="$2"
            cp "$dir/droidtop-agent$EXT" "dist/droidtop-agent-$system$EXT"
            cp "$dir/droidtop-agent-app$EXT" "dist/droidtop-agent-app-$system$EXT"
            if [ "${system%%-*}" = macos ]; then
              local app="bundle-$system/droidtop-agent.app"
              mkdir -p "$app/Contents/MacOS"
              cp "$dir/droidtop-agent-app" "$dir/droidtop-agent" "$app/Contents/MacOS/"
              sed "s/@VERSION@/$RUN/" packaging/macos/Info.plist > "$app/Contents/Info.plist"
              (cd "bundle-$system" && ditto -c -k --keepParent droidtop-agent.app "../dist/droidtop-agent-$system.app.zip")
            fi
          }
          cargo build --release -p droidtop-agent -p droidtop-agent-app
          place target/release "$SYSTEM"
          # Service mode's secure-screen helper (docs/DESIGN.md section 19): windowcast's
          # own program at the windowcast this workspace pins, shipped beside the agent.
          if [ "$SYSTEM" = windows-x86_64 ]; then
            rev=$(sed -n 's/^windowcast-secure-helper = .*rev = "\([0-9a-f]*\)".*/\1/p' Cargo.toml)
            test -n "$rev"
            cargo install --locked --git https://github.com/Droidtop/windowcast --rev "$rev" windowcast-secure-helper --root helper
            cp helper/bin/windowcast-secure-helper.exe dist/windowcast-secure-helper-windows-x86_64.exe
          fi
          if [ -n "$ALSO" ]; then
            rustup target add "$ALSO"
            cargo build --release -p droidtop-agent -p droidtop-agent-app --target "$ALSO"
            place "target/$ALSO/release" "$ALSO_SYSTEM"
          fi
          ls -l dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: droidtop-agent-${{ matrix.system }}
          path: dist/

  linux-packages:
    # The Linux builds of the test job, packed four ways (packaging/linux):
    # a portable tarball, one runnable file, a .deb and an .rpm. Each is
    # installed and removed again here before it is offered.
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: linux-x86_64
            arch: x86_64
          - os: ubuntu-24.04-arm
            system: linux-aarch64
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: droidtop-agent-${{ matrix.system }}
          path: built

      - name: Check the scripts
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y squashfs-tools zstd shellcheck desktop-file-utils
          shellcheck -s sh packaging/linux/*.sh
          desktop-file-validate packaging/linux/dev.droidtop.agent.desktop

      - name: Build the packages
        env:
          ARCH: ${{ matrix.arch }}
          SYSTEM: ${{ matrix.system }}
          RUN: ${{ github.run_number }}
          TOOLS_DIR: ${{ runner.temp }}/linux-tools
        run: |
          set -eu
          mkdir bins
          cp "built/droidtop-agent-$SYSTEM" bins/droidtop-agent
          cp "built/droidtop-agent-app-$SYSTEM" bins/droidtop-agent-app
          chmod +x bins/*
          sh packaging/linux/build.sh --arch "$ARCH" --bins bins --out linux --release "$RUN"

      - name: Install and remove it again (tarball and single file)
        run: sh packaging/linux/test.sh linux "${{ matrix.arch }}"

      - name: The .deb installs on a clean Ubuntu, ships its unit disabled, and removes cleanly
        run: |
          set -eu
          dpkg-deb -I linux/*.deb
          dpkg-deb -c linux/*.deb
          docker run --rm -v "$PWD/linux:/pkg:ro" ubuntu:24.04 sh -c '
            set -eu
            apt-get update -qq
            apt-get install -y -qq /pkg/*.deb
            for b in droidtop-agent droidtop-agent-app; do
              missing=$(ldd /usr/bin/$b | grep "not found" || true)
              if [ -n "$missing" ]; then echo "$b: $missing"; exit 1; fi
            done
            droidtop-agent --help | head -n 3
            test -f /usr/lib/systemd/user/droidtop-agent.service
            test -f /usr/share/applications/dev.droidtop.agent.desktop
            if [ -e /etc/systemd/user/default.target.wants/droidtop-agent.service ]; then echo "the unit is enabled"; exit 1; fi
            apt-get remove -y -qq droidtop-agent
            for f in /usr/bin/droidtop-agent /usr/bin/droidtop-agent-app /usr/lib/systemd/user/droidtop-agent.service /usr/share/applications/dev.droidtop.agent.desktop; do
              if [ -e "$f" ]; then echo "left behind: $f"; exit 1; fi
            done'

      - name: The .rpm installs on Fedora, and removes cleanly
        run: |
          set -eu
          docker run --rm -v "$PWD/linux:/pkg:ro" fedora:42 sh -c '
            set -eu
            rpm -qpi /pkg/*.rpm
            rpm -qpl /pkg/*.rpm
            dnf install -y /pkg/*.rpm
            for b in droidtop-agent droidtop-agent-app; do
              missing=$(ldd /usr/bin/$b | grep "not found" || true)
              if [ -n "$missing" ]; then echo "$b: $missing"; exit 1; fi
            done
            droidtop-agent --help | head -n 3
            test -f /usr/lib/systemd/user/droidtop-agent.service
            rpm -e droidtop-agent
            if [ -e /usr/bin/droidtop-agent ]; then echo "left behind"; exit 1; fi'

      - name: One copy of the install scripts in the release
        if: matrix.arch != 'x86_64'
        run: rm -f linux/install.sh linux/uninstall.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: droidtop-agent-linux-packages-${{ matrix.arch }}
          path: linux/

  windows-installer:
    # The Windows build of the test job, made into a per-user installer
    # (packaging/windows, Droidtop/tracker#116). It is installed silently,
    # run once, and uninstalled again here before it is offered.
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: droidtop-agent-windows-x86_64
          path: dist

      - name: Install Inno Setup (pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = @{}
          Get-Content packaging/windows/pins.env | Where-Object { $_ -match '^([A-Z0-9_]+)=(.+)$' } | ForEach-Object { $pins[$Matches[1]] = $Matches[2] }
          $version = $pins['INNO_VERSION']
          $tag = 'is-' + $version.Replace('.', '_')
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$version.exe" -OutFile inno.exe
          $hash = (Get-FileHash inno.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $pins['INNO_SHA256']) { throw "Inno Setup's SHA-256 is $hash, not the pinned one" }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          $p = Start-Process -FilePath .\inno.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',"/DIR=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup's installer exited $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) { throw 'no ISCC.exe' }

      - name: Make the installer
        shell: pwsh
        env:
          RUN: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path $env:RUNNER_TEMP 'inno\ISCC.exe'
          & $iscc "/DAppVersion=0.1.$env:RUN" "/DDist=$env:GITHUB_WORKSPACE\dist" packaging\windows\droidtop-agent.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
          New-Item -ItemType Directory -Force windows | Out-Null
          Copy-Item packaging\windows\out\droidtop-agent-setup-windows-x86_64.exe windows\
          Get-ChildItem windows

      - name: Install it, run it, uninstall it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Start-Process -FilePath windows\droidtop-agent-setup-windows-x86_64.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=autostart' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "setup exited $($setup.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\droidtop-agent'
          foreach ($f in 'droidtop-agent.exe','droidtop-agent-app.exe','windowcast-secure-helper.exe','unins000.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" }
          }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'droidtop-agent.lnk'
          if (-not (Test-Path $lnk)) { throw "no Start menu entry at $lnk" }
          & (Join-Path $dir 'droidtop-agent.exe') --help | Select-Object -First 3
          $run = Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'droidtop-agent' -ErrorAction SilentlyContinue
          if (-not $run) { throw 'the autostart task did not turn on starting at sign-in' }
          Write-Output "starts at sign-in: $($run.'droidtop-agent')"
          $un = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($un.ExitCode -ne 0) { throw "uninstall exited $($un.ExitCode)" }
          # The uninstaller removes itself a moment after it exits.
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dir 'droidtop-agent.exe')) { throw 'the program was left behind' }
          if (Test-Path $lnk) { throw 'the Start menu entry was left behind' }
          if (Get-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'droidtop-agent' -ErrorAction SilentlyContinue) { throw 'starting at sign-in was left on' }
          Write-Output 'installed, ran and uninstalled'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: droidtop-agent-windows-installer
          path: windows/

  python:
    # The agent as a Python extension module (crates/python), the one a
    # desktop manager such as Pythia loads to be this computer's agent:
    # one abi3 wheel per system, for Python 3.10 and newer. Each is installed
    # and called once here before it is offered.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: linux-x86_64
          - os: ubuntu-24.04-arm
            system: linux-aarch64
          - os: windows-latest
            system: windows-x86_64
          - os: macos-latest
            system: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        shell: bash
        env:
          RUN: ${{ github.run_number }}
        run: |
          set -eu
          python -m pip install --quiet "maturin>=1.7,<2"
          # manylinux_2_39: the glibc the Linux programs already need (docs/DESIGN.md section 13).
          compat=""
          if [ "$RUNNER_OS" = Linux ]; then compat="--compatibility manylinux_2_39 --auditwheel skip"; fi
          # shellcheck disable=SC2086
          maturin build --release -m crates/python/Cargo.toml --out wheels $compat
          ls -l wheels

      - name: Install it and call it
        shell: bash
        run: |
          set -eu
          python -m pip install --quiet wheels/*.whl
          export DROIDTOP_AGENT_HOME="$RUNNER_TEMP/agent-home"
          python - <<'PY'
          import importlib
          import os
          import tempfile
          import droidtop_agent
          from droidtop_agent import AgentError, store
          # Every submodule imports by its own name and answers one call.
          for name in ("store", "pair", "scan", "saves", "service"):
              importlib.import_module("droidtop_agent." + name)
          me = store.identity()
          assert len(me["id"]) == 64, me
          assert len(me["fingerprint"]) == 64, me
          print("droidtop_agent", droidtop_agent.__version__, "protocol", droidtop_agent.PROTOCOL_VERSION, me["name"])
          assert store.devices() == []
          assert droidtop_agent.service.serving() == {"state": "off"}
          assert droidtop_agent.service.events() == []
          assert droidtop_agent.service.events(since=0, wait=0.1) == []
          store.set_announce("syncthing", {"syncthing": "CI-DEVICE-ID"})
          assert store.announcements() == {"syncthing": {"syncthing": "CI-DEVICE-ID"}}
          store.set_announce("syncthing")
          assert store.announcements() == {}
          assert droidtop_agent.pair.status() == {"state": "idle"}
          assert isinstance(droidtop_agent.pair.places(), list)
          assert droidtop_agent.saves.copies() == []
          folder = tempfile.mkdtemp(prefix="ci-game-")
          launcher = os.path.join(tempfile.mkdtemp(prefix="ci-launchers-"), "Battle.net")
          os.makedirs(launcher)
          assert droidtop_agent.scan.launcher_folder(launcher) == "Battle.net"
          assert droidtop_agent.scan.launcher_folder(folder) is None
          out = droidtop_agent.scan.set_manager_games("CI", [
              {"key": "title:ci game", "title": "CI Game", "platform": "pc", "install": {"installed": True, "version": "1.0"}, "base": folder}
          ])
          assert out["games"] == 1, out
          assert "title:ci game" in store.library()
          try:
              store.unpair("ffff")
              raise SystemExit("unpair of an unknown handheld did not raise")
          except AgentError as e:
              print("refused as expected:", e)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: droidtop-agent-python-${{ matrix.system }}
          path: wheels/

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, linux-packages, windows-installer, python]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish this build's release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          set -eu
          tag="build-${RUN}"
          # Sums of everything offered, so install.sh and anyone else can check a download.
          (cd dist && sha256sum -- * > ../SHA256SUMS && mv ../SHA256SUMS .)
          ls -l dist
          gh release create "$tag" dist/* --repo "$REPO" --target "$SHA" \
            --title "Build ${RUN}" \
            --notes "Built from ${SHA}. See CHANGELOG.md."
