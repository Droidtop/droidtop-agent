[workspace]
resolver = "2"
members = ["crates/service", "crates/stream", "crates/agent", "crates/app", "crates/android", "crates/python"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Droidtop/droidtop-agent"
rust-version = "1.89"

[workspace.dependencies]
# The shared libraries (Droidtop/tracker#867): each a repository of its own that belongs to no program,
# pinned here by tag. Their crates keep the names this workspace's code imports them by.
droidtop-agent-core = { package = "sync-core", git = "https://github.com/Droidtop/lib-sync", tag = "v0.1.1" }
droidtop-agent-store = { package = "sync-store", git = "https://github.com/Droidtop/lib-sync", tag = "v0.1.1" }
droidtop-agent-pair = { package = "sync-pair", git = "https://github.com/Droidtop/lib-sync", tag = "v0.1.1" }
droidtop-agent-scan = { package = "games-scan", git = "https://github.com/Droidtop/lib-games", tag = "v0.1.2" }
droidtop-agent-saves = { package = "saves-locate", git = "https://github.com/Droidtop/lib-saves", tag = "v0.1.2" }
droidtop-agent-contexts = { package = "plugins-contexts", git = "https://github.com/Droidtop/lib-plugins", tag = "v0.1.3" }
# KDE Connect for Pythia (Droidtop/tracker#645; droidtop links it in its own native/). Pinned to the
# commit on lib-kdeconnect's ci/kdeconnect-core-645 until that lands and is tagged v0.1.0.
kdeconnect-service = { git = "https://github.com/Droidtop/lib-kdeconnect", rev = "9af2797cee437e49290948ab9785bd56272061cc" }
# windowcast's device identity and pairing, used as they are (docs/DESIGN.md
# section 3). Pinned by commit; both crates are GPL-3.0-only, which is why
# this workspace is too.
windowcast-identity = { git = "https://github.com/Droidtop/windowcast", rev = "7359936a6083cc7f2ca6cae67aedf45ad9797026" }
windowcast-pairing = { git = "https://github.com/Droidtop/windowcast", rev = "7359936a6083cc7f2ca6cae67aedf45ad9797026" }
# windowcast's secure-screen helper and its client API (windowcast#467):
# service mode, docs/DESIGN.md section 19. The same windowcast as above.
windowcast-secure-helper = { git = "https://github.com/Droidtop/windowcast", rev = "7359936a6083cc7f2ca6cae67aedf45ad9797026" }
# Rendezvous away from the LAN (Syncthing's global discovery, STUN, hole
# punching), shared with windowcast rather than copied. windowcast v0.37.0 and
# one commit (7359936).
windowcast-rendezvous = { git = "https://github.com/Droidtop/windowcast", rev = "7359936a6083cc7f2ca6cae67aedf45ad9797026" }
# windowcast's host and its Windows window source: the agent streams the
# window of a game it started for a handheld (docs/DESIGN.md section 22).
# The same windowcast as above.
windowcast-host = { git = "https://github.com/Droidtop/windowcast", rev = "7359936a6083cc7f2ca6cae67aedf45ad9797026" }
windowcast-agent-windows = { git = "https://github.com/Droidtop/windowcast", rev = "7359936a6083cc7f2ca6cae67aedf45ad9797026" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Userspace WireGuard (BSD-3-Clause) and a userspace TCP stack to carry the
# session channel inside it (0BSD): docs/DESIGN.md section 10.
boringtun = { version = "0.7", default-features = false }
smoltcp = { version = "=0.11.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
# The session channel (docs/DESIGN.md section 4): TLS 1.3 with both sides
# self-signed certificates pinned at pairing, on ring (it builds for every
# target here, Android included, with no extra toolchain).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
# The code both screens show when pairing by comparison (core::confirm).
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# The computer's side, shared by its crates (docs/DESIGN.md section 13).
serde_yaml = "0.9"
ureq = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
dirs = "5"
gethostname = "0.5"
roxmltree = "0.20"
# Reads Ren'Py's compiled scripts (zlib) for a game's save folder; already
# in the tree through ureq.
flate2 = "1"
plist = "1"
if-addrs = "0.13"
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# windowcast's IronRDP, sspi and winscard copies (windowcast Cargo.toml,
# [patch.crates-io]): its Windows window source brings IronRDP, whose picky
# pre-release pins do not resolve without them. A workspace's patches do not
# reach a crate taken from git, so they are repeated here, from the same
# windowcast. Drop them when windowcast does.
[patch.crates-io]
ironrdp-connector = { git = "https://github.com/Droidtop/windowcast", rev = "7359936a6083cc7f2ca6cae67aedf45ad9797026" }
sspi = { git = "https://github.com/Droidtop/windowcast", rev = "7359936a6083cc7f2ca6cae67aedf45ad9797026" }
winscard = { git = "https://github.com/Droidtop/windowcast", rev = "7359936a6083cc7f2ca6cae67aedf45ad9797026" }
