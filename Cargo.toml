[workspace]
resolver = "2"
members = ["crates/core", "crates/store", "crates/scan", "crates/saves", "crates/pair", "crates/contexts", "crates/service", "crates/agent", "crates/app", "crates/android", "crates/python"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Droidtop/droidtop-agent"
rust-version = "1.85"

[workspace.dependencies]
# windowcast's device identity and pairing, used as they are (docs/DESIGN.md
# section 3). Pinned by commit; both crates are GPL-3.0-only, which is why
# this workspace is too.
windowcast-identity = { git = "https://github.com/Droidtop/windowcast", rev = "cd1ed2371b1e793babf6703b5dcfab94d979f1c6" }
windowcast-pairing = { git = "https://github.com/Droidtop/windowcast", rev = "cd1ed2371b1e793babf6703b5dcfab94d979f1c6" }
# Rendezvous away from the LAN (Syncthing's global discovery, STUN, hole
# punching), shared with windowcast rather than copied. windowcast v0.35.0.
windowcast-rendezvous = { git = "https://github.com/Droidtop/windowcast", rev = "cd1ed2371b1e793babf6703b5dcfab94d979f1c6" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Userspace WireGuard (BSD-3-Clause) and a userspace TCP stack to carry the
# session channel inside it (0BSD): docs/DESIGN.md section 10.
boringtun = { version = "0.7", default-features = false }
smoltcp = { version = "=0.11.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
# The session channel (docs/DESIGN.md section 4): TLS 1.3 with both sides
# self-signed certificates pinned at pairing, on ring (it builds for every
# target here, Android included, with no extra toolchain).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
# The code both screens show when pairing by comparison (core::confirm).
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# The computer's side, shared by its crates (docs/DESIGN.md section 13).
serde_yaml = "0.9"
ureq = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
dirs = "5"
gethostname = "0.5"
roxmltree = "0.20"
plist = "1"
if-addrs = "0.13"
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
