[workspace]
resolver = "2"
members = ["crates/core", "crates/agent", "crates/app", "crates/android"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Droidtop/droidtop-agent"
rust-version = "1.85"

[workspace.dependencies]
# windowcast's device identity and pairing, used as they are (docs/DESIGN.md
# section 3). Pinned by commit; both crates are GPL-3.0-only, which is why
# this workspace is too.
windowcast-identity = { git = "https://github.com/Droidtop/windowcast", rev = "9481e55ae5f4265b3420e95e0f0a69bd5ad4904b" }
windowcast-pairing = { git = "https://github.com/Droidtop/windowcast", rev = "9481e55ae5f4265b3420e95e0f0a69bd5ad4904b" }
# Rendezvous away from the LAN (Syncthing's global discovery, STUN, hole
# punching), shared with windowcast rather than copied. windowcast 0.15.0.
windowcast-rendezvous = { git = "https://github.com/Droidtop/windowcast", rev = "da060ccef595a8dad76deb3113db0a5b394e1210" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Userspace WireGuard (BSD-3-Clause) and a userspace TCP stack to carry the
# session channel inside it (0BSD): docs/DESIGN.md section 10.
boringtun = { version = "0.7", default-features = false }
smoltcp = { version = "=0.11.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp"] }
snow = "=0.9.6"
chacha20poly1305 = "0.10"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
