[package]
name = "droidtop-agent-core"
description = "The part of droidtop-agent both ends share: identity, pairing, the session channel, the protocol and the sync rules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
windowcast-identity.workspace = true
windowcast-pairing.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
snow.workspace = true
boringtun.workspace = true
smoltcp.workspace = true
chacha20poly1305.workspace = true
sha2.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Rendezvous away from the LAN (src/rendezvous.rs): Syncthing's global
# discovery over https with a client certificate made from the device key.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring"] }
