[package]
name = "droidtop-agent-stream"
description = "Streams the window of a game this computer started for a handheld, with its sound and gamepads: windowcast's host, embedded"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "droidtop_agent_stream"
path = "src/lib.rs"

# windowcast's host and its Windows window source (docs/DESIGN.md section 22).
# Only on Windows: elsewhere the crate says it cannot stream, so the Android
# library and the macOS and Linux builds carry none of it.
[target.'cfg(windows)'.dependencies]
windowcast-host.workspace = true
windowcast-identity.workspace = true
windowcast-agent-windows.workspace = true
windowcast-transport.workspace = true
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync"] }
windows-sys = { workspace = true, features = ["Win32_UI_HiDpi"] }

# The tunnel's join to windowcast's host (src/carried.rs) is tested on
# Linux x86_64, with a host that has no windows: windowcast's own CI builds
# its host there, and it needs libpam (CI installs libpam0g-dev).
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
windowcast-host.workspace = true
windowcast-identity.workspace = true
windowcast-transport.workspace = true
windowcast-protocol.workspace = true
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
