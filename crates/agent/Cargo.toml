[package]
name = "droidtop-agent"
description = "The program for your computer that keeps it in step with droidtop on a handheld: games, saves and plugin contexts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The command line: a thin host over the agent's crates (docs/DESIGN.md section 13).
[[bin]]
name = "droidtop-agent"
path = "src/main.rs"

[dependencies]
droidtop-agent-core = { path = "../core" }
droidtop-agent-service = { path = "../service" }
serde_json.workspace = true
