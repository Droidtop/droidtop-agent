[package]
name = "droidtop-agent-android"
description = "droidtop's side of droidtop-agent: the core behind one JNI call, built as libdroidtop_agent.so for arm64-v8a and x86_64"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "droidtop_agent"
crate-type = ["cdylib", "rlib"]

[dependencies]
droidtop-agent-core = { path = "../core" }
jni = { version = "0.21", default-features = false }
serde.workspace = true
serde_json.workspace = true
