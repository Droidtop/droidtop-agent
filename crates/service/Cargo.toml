[package]
name = "droidtop-agent-service"
description = "The running droidtop agent on a computer: what serves paired handhelds, over the agent's state, scanner, saves, pairing and context adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "droidtop_agent_service"
path = "src/lib.rs"

[features]
# Store and forward through a WebDAV share (src/webdav.rs), over lib-net's share client. Off by default
# because lib-net needs Rust 1.89 and Pythia's build holds 1.85; the agent and the app turn it on.
webdav = ["dep:net-remote"]

[dependencies]
net-remote = { workspace = true, optional = true }
droidtop-agent-core.workspace = true
droidtop-agent-contexts.workspace = true
droidtop-agent-saves.workspace = true
droidtop-agent-scan.workspace = true
droidtop-agent-store.workspace = true
droidtop-agent-stream = { path = "../stream" }
# The droidtop-run relay's client: the fallback for a paired device away (docs/DESIGN.md section 10).
droidtop-agent-relay = { path = "../relay" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
dirs.workspace = true
# The LaunchAgent that starts the agent at sign-in on macOS.
plist.workspace = true
# This computer's addresses, for the WireGuard endpoints it tells the handheld.
if-addrs.workspace = true
# This computer's Syncthing: its config.xml, and its REST API on loopback
# (docs/DESIGN.md section 18).
roxmltree.workspace = true
ureq.workspace = true
# Service mode: windowcast's secure-screen helper (docs/DESIGN.md section 19).
windowcast-secure-helper.workspace = true

[target.'cfg(windows)'.dependencies]
# Asking Windows for administrator approval (UAC) to change service mode.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# The per-user Run key that starts the agent at sign-in.
winreg.workspace = true
