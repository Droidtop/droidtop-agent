[package]
name = "droidtop-agent-python"
description = "The computer's droidtop agent as a Python extension module (droidtop_agent), so a desktop manager such as Pythia runs the agent in its own process instead of beside it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "droidtop_agent"
crate-type = ["cdylib"]

[dependencies]
droidtop-agent-service = { path = "../service" }
droidtop-agent-scan = { path = "../scan" }
droidtop-agent-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
# The stable ABI (abi3) from Python 3.10 on: one wheel per system serves
# every newer Python. generate-import-lib lets Windows link without an
# installed Python; build.rs adds macOS's link arguments for an extension.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310", "generate-import-lib"] }

[build-dependencies]
pyo3-build-config = "0.22"
