[package]
name = "droidtop-agent-python"
description = "The computer's droidtop agent as a Python extension module (droidtop_agent), so a desktop manager such as Pythia runs the agent in its own process instead of beside it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# The Rust name a manager imports it by; the Python module is still droidtop_agent (pyproject.toml
# module-name, and the #[pymodule] below). Not droidtop_agent: crates/android's rlib has that name, and two rlibs
# of one name in one target folder overwrite each other.
name = "droidtop_agent_python"
# cdylib: the droidtop_agent module itself; rlib: so a desktop manager builds its own module over it
# (Embedder, register; docs/DESIGN.md section 16).
crate-type = ["cdylib", "rlib"]

[dependencies]
droidtop-agent-service = { path = "../service" }
droidtop-agent-store.workspace = true
droidtop-agent-pair.workspace = true
droidtop-agent-scan.workspace = true
droidtop-agent-saves.workspace = true
droidtop-agent-core.workspace = true
serde_json.workspace = true
# The stable ABI (abi3) from Python 3.10 on: one wheel per system serves
# every newer Python. generate-import-lib lets Windows link without an
# installed Python; build.rs adds macOS's link arguments for an extension.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310", "generate-import-lib"] }

[build-dependencies]
pyo3-build-config = "0.22"
