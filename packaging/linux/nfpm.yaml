# The .deb and .rpm: build.sh fills in the variables below and runs nfpm on this.
# The systemd user unit is shipped but not enabled.
name: droidtop-agent
arch: ${NFPM_ARCH}
platform: linux
version: ${PKG_VERSION}
release: ${PKG_RELEASE}
section: utils
priority: optional
maintainer: Droidtop <noreply@github.com>
vendor: Droidtop
homepage: https://github.com/Droidtop/droidtop-agent
license: GPL-3.0-only
description: |-
  Keeps this computer in step with droidtop on a handheld
  droidtop-agent syncs game saves, the game library and plugin data between
  this computer and handhelds running droidtop. It does not stream or
  control the computer, and needs no VPN. droidtop-agent-app is its window
  and tray icon.
contents:
  - src: ${STAGE}/bin/droidtop-agent
    dst: /usr/bin/droidtop-agent
  - src: ${STAGE}/bin/droidtop-agent-app
    dst: /usr/bin/droidtop-agent-app
  - src: ${PKGFILES}/dev.droidtop.agent.desktop
    dst: /usr/share/applications/dev.droidtop.agent.desktop
  - src: ${STAGE}/share/icons/hicolor/scalable/apps/dev.droidtop.agent.svg
    dst: /usr/share/icons/hicolor/scalable/apps/dev.droidtop.agent.svg
  - src: ${PKGFILES}/droidtop-agent.service
    dst: /usr/lib/systemd/user/droidtop-agent.service
  - src: ${STAGE}/LICENSE
    dst: /usr/share/doc/droidtop-agent/LICENSE
overrides:
  deb:
    depends:
      - libc6 (>= ${GLIBC_MIN})
      - libgcc-s1
    recommends:
      - libgl1
      - libegl1
      - libxkbcommon0
      - libwayland-client0
  rpm:
    depends:
      - glibc >= ${GLIBC_MIN}
      - libgcc
    recommends:
      - mesa-libGL
      - mesa-libEGL
      - libxkbcommon
      - libwayland-client
